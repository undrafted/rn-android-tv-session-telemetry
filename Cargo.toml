[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
session-telemetry-adb = { path = "crates/session-telemetry-adb" }
session-telemetry-analysis = { path = "crates/session-telemetry-analysis" }
session-telemetry-protocol = { path = "crates/session-telemetry-protocol" }
session-telemetry-report = { path = "crates/session-telemetry-report" }
session-telemetry-session = { path = "crates/session-telemetry-session" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
crc32fast = "1.5.1"
